[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arrowhead"
version = "0.2.0"
description = "Python SDK and CLI for the Arrowhead Framework"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Klas Segeljakt", email = "klas.segeljakt@ri.se"}
]
keywords = ["arrowhead", "iot", "industrial", "framework", "soa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Networking"
]
dependencies = [
    "cryptography>=3.0.0",
    "click>=8.0.0",
    "fastapi>=0.95.0",
    "uvicorn[standard]>=0.20.0",
    "httpx[http2]>=0.23.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
    "rich>=12.0.0",
    "PyJWT>=2.8.0",
    "jwcrypto>=1.5.6"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0"
]

[project.scripts]
arrowhead = "arrowhead.cli:main"

[project.urls]
Homepage = "https://github.com/cluster1-arrowcolony/arrowhead-python-sdk"
Repository = "https://github.com/cluster1-arrowcolony/arrowhead-python-sdk"
Documentation = "https://github.com/cluster1-arrowcolony/arrowhead-python-sdk"


[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
